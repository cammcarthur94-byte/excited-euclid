client_id = "b0daba369e048eda0508646744da6d6f"
name = "Catalog Commander"
application_url = "https://excited-euclid.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,write_inventory,read_inventory,read_locations,write_publications,read_publications"

[auth]
redirect_urls = [
  "https://excited-euclid.onrender.com/auth/callback",
  "https://excited-euclid.onrender.com/auth/shopify/callback",
  "https://excited-euclid.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "/webhooks/compliance"

[build]
automatically_update_urls_on_dev = false
